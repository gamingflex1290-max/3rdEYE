name: Unzip Project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip into repo
        run: |
          mkdir tmp
          unzip -o "$(ls *.zip | head -1)" -d tmp
          DIR=$(dirname "$(find tmp -name settings.gradle.kts | head -1)")
          cp -r "$DIR"/. .
          rm -rf tmp
          rm -f *.zip

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip project" || echo "nothing to commit"
          git push
